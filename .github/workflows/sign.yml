name: FishC Daily Sign

on:
  schedule:
    # 每天 UTC 时间 0:00 运行（北京时间 8:00）
    # cron 表达式格式：分 时 日 月 星期
    - cron: '0 0 * * *'
  
  # 允许手动触发工作流
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    
    steps:
    # 检出代码
    - uses: actions/checkout@v3
    
    # 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    # 安装依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    # 运行签到脚本
    - name: Run sign script
      env:
        FISHC_USERNAME: ${{ secrets.FISHC_USERNAME }}
        FISHC_PASSWORD: ${{ secrets.FISHC_PASSWORD }}
      run: python auto_sign_github.py
    
    # （可选）上传日志作为 artifact
    - name: Upload log
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: sign-log
        path: sign_log.txt
        retention-days: 7
