# ruff.toml

# 目标 Python 版本
target-version = "py39"

# 行长度限制
line-length = 88

# 排除的目录
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
]

# Linter 配置
[lint]
# 启用的规则
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (导入排序)
    "B",   # flake8-bugbear
]

# 忽略的规则
ignore = [
    "E501",  # 行长度警告（让 formatter 处理）
]

# Formatter 配置
[format]
# 使用双引号
quote-style = "double"
# 缩进风格
indent-style = "space"
# 跳过魔法 trailing comma
skip-magic-trailing-comma = false
# 行结束符
line-ending = "auto"